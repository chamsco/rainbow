<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave surface</title>
<style>
  /* The surface is a transparent view above every page. It draws only what the chrome sends,
     and only as text and buttons: it never renders markup. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .toast { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 14px;
    background: #1c1f22; color: #eef2f5; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.1);
    animation: in .18s cubic-bezier(.2, .8, .2, 1); }
  .toast span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 0; border-radius: 8px; padding: 5px 10px; background: rgba(255,255,255,.14); color: inherit; font: inherit; }
  button:hover { background: rgba(255,255,255,.24); }
  /* Menus: the same glass as the chrome's own, drawn above the page. */
  .menu { position: absolute; left: 0; top: 0; width: var(--w, 240px); padding: 5px; border-radius: 12px; box-sizing: border-box; isolation: isolate; overflow: hidden;
    background: rgba(250, 251, 250, .94); color: #10181d; box-shadow: 0 14px 40px rgba(0,0,0,.28), 0 0 0 1px rgba(16,24,29,.1);
    backdrop-filter: blur(30px) saturate(1.5); animation: in .12s cubic-bezier(.2, .8, .2, 1); }
  .dark .menu { background: rgba(32, 35, 38, .94); color: #eef2f4; box-shadow: 0 14px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); }
  /* Frosted glass: a blurred copy of the page behind the menu, then a tint. A transparent view cannot
     blur what lies under it, so the chrome sends a picture of the page and the menu blurs that. */
  .menu.has-glass { background: none; }
  .menu .glass { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; border-radius: inherit; }
  .menu .glass img { position: absolute; max-width: none; filter: blur(22px) saturate(1.6); }
  .menu .glass::after { content: ""; position: absolute; inset: 0; background: rgba(250, 251, 250, .7); }
  .dark .menu .glass::after { background: rgba(24, 27, 30, .74); }
  .menu.noanim { animation: none; }
  .menu.sub { left: var(--x); top: var(--y); }
  .menu .row { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 10px; border-radius: 7px; background: none;
    color: inherit; text-align: left; white-space: nowrap; }
  .menu .row:hover, .menu .row.open { background: rgba(16,24,29,.08); }
  .dark .menu .row:hover, .dark .menu .row.open { background: rgba(255,255,255,.1); }
  .menu .row.danger { color: #c4392f; }
  .menu .row small { margin-left: auto; opacity: .55; font-size: 11px; }
  .menu .row .lab { overflow: hidden; text-overflow: ellipsis; }
  .menu .row .ico { display: grid; place-items: center; width: 16px; height: 16px; flex: none; }
  .menu .row .ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .menu .row.has-sub::after { content: "›"; margin-left: auto; opacity: .6; }
  .menu .row.check::before { content: "✓"; width: 16px; text-align: center; flex: none; }
  .menu .row .sw { margin-left: auto; width: 30px; height: 18px; border-radius: 9px; background: rgba(16,24,29,.22); position: relative; flex: none; transition: background .15s; }
  .dark .menu .row .sw { background: rgba(255,255,255,.22); }
  .menu .row .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .menu .row .sw.on { background: #2e9d62; }
  .menu .row .sw.on::after { transform: translateX(12px); }
  .menu .mini { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: none; color: inherit; flex: none; }
  .menu .mini:hover { background: rgba(16,24,29,.1); }
  .dark .menu .mini:hover { background: rgba(255,255,255,.14); }
  .menu .mini svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .menu .host { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; font-weight: 600; }
  .menu .host img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
  .menu .host .lab { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .host .lock { opacity: .6; width: 14px; height: 14px; display: grid; place-items: center; }
  .menu .host .lock svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .menu hr { border: 0; border-top: 1px solid rgba(16,24,29,.1); margin: 4px 6px; }
  .dark .menu hr { border-top-color: rgba(255,255,255,.12); }
  .menu .head { padding: 6px 10px 3px; font-size: 11px; font-weight: 600; opacity: .55; }
  .menu button { border: 0; padding: 0; }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
function say(act) { window.ipc.postMessage(JSON.stringify({ act: act })); }
// Only text and a whitelisted icon ever reach the DOM: the labels may carry text from a page.
function icon(svg) {
  return typeof svg === 'string' && /^<svg[\s>]/.test(svg) && !/<script|\son\w+\s*=|javascript:/i.test(svg) ? svg : '';
}
function list(items, box) {
  items.forEach(function (it) {
    if (it.t === 'sep') return box.append(document.createElement('hr'));
    if (it.t === 'host') {
      var hd = document.createElement('div'); hd.className = 'host';
      var im = document.createElement('img'); im.alt = ''; im.src = String(it.fav || ''); im.onerror = function () { im.style.visibility = 'hidden'; }; hd.append(im);
      var hl = document.createElement('span'); hl.className = 'lab'; hl.textContent = it.label; hd.append(hl);
      var lk = document.createElement('span'); lk.className = 'lock'; lk.innerHTML = icon(it.secure ? '<svg viewBox="0 0 16 16"><rect x="4" y="7" width="8" height="6" rx="1.4"/><path d="M6 7V5a2 2 0 0 1 4 0v2"/></svg>' : '<svg viewBox="0 0 16 16"><path d="M8 3 14 13H2z"/><path d="M8 7v2.6M8 11.4v.1"/></svg>'); hd.append(lk);
      return box.append(hd);
    }
    if (it.t === 'head') { var h = document.createElement('div'); h.className = 'head'; h.textContent = it.label; return box.append(h); }
    var b = document.createElement('button'); b.className = 'row ' + (it.cls || '') + (it.sub ? ' has-sub' : '');
    if (it.ico) { var i = document.createElement('span'); i.className = 'ico'; i.innerHTML = icon(it.ico); b.append(i); }
    var l = document.createElement('span'); l.className = 'lab'; l.textContent = it.label; b.append(l);
    if (it.kbd) { var k = document.createElement('small'); k.textContent = it.kbd; b.append(k); }
    if (it.sw !== undefined) { var sw = document.createElement('span'); sw.className = 'sw' + (it.sw ? ' on' : ''); b.append(sw); }
    if (it.mini) {
      var mb = document.createElement('span'); mb.className = 'mini'; mb.title = String(it.mini.title || ''); mb.innerHTML = icon(it.mini.ico);
      mb.onclick = function (e) { e.stopPropagation(); say('m:' + it.mini.id); };
      b.append(mb);
    }
    if (it.sub) b.onpointerenter = function () { openSub(b, it.sub); };
    else b.onpointerenter = function () { closeSub(); };
    if (it.id !== undefined) b.onclick = function () { say('m:' + it.id); };
    box.append(b);
  });
}
function closeSub() { var s = document.querySelector('.menu.sub'); if (s) s.remove(); document.querySelectorAll('.row.open').forEach(function (r) { r.classList.remove('open'); }); }
function openSub(row, items) {
  closeSub();
  row.classList.add('open');
  var m = document.createElement('div'); m.className = 'menu sub';
  var main = document.querySelector('.menu'), r = row.getBoundingClientRect();
  m.style.setProperty('--x', (main.offsetWidth - 4) + 'px'); m.style.setProperty('--y', (r.top - 5) + 'px');
  list(items, m); document.body.append(m); m.classList.add('noanim'); glass(m);
}
var curBg = null;
function glass(m) {
  if (!curBg) return;
  var r = m.getBoundingClientRect(), g = document.createElement('div'); g.className = 'glass';
  var im = new Image(); im.alt = ''; im.src = curBg.src;
  im.style.width = curBg.pw + 'px'; im.style.height = curBg.ph + 'px';
  im.style.left = (curBg.px - curBg.sx - r.left) + 'px'; im.style.top = (curBg.py - curBg.sy - r.top) + 'px';
  g.append(im); m.prepend(g); m.classList.add('has-glass');
}
function menu(root, v) {
  var m = document.createElement('div'); m.className = 'menu' + (v.refresh ? ' noanim' : ''); m.style.setProperty('--w', (v.w || 240) + 'px');
  list(v.items, m); root.append(m); glass(m);
}
// A click on the empty part of the surface, or Escape, closes the menu.
document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.menu')) say('dismiss'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') say('dismiss'); });
window.surface = {
  set: function (v) {
    var root = document.getElementById('root');
    root.replaceChildren();
    document.documentElement.classList.toggle('dark', !!(v && v.dark));
    curBg = v && v.bg || null;
    if (v && v.kind === 'menu') return menu(root, v);
    if (!v || v.kind !== 'toast') return;
    var t = document.createElement('div'); t.className = 'toast';
    var s = document.createElement('span'); s.textContent = String(v.text || ''); t.append(s);
    if (v.action) {
      var b = document.createElement('button'); b.textContent = String(v.action);
      b.onclick = function () { window.ipc.postMessage(JSON.stringify({ act: 'toast-action' })); };
      t.append(b);
    }
    root.append(t);
  }
};
</script>
</body>
</html>
